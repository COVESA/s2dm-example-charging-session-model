directive @geoPoint(shape: GeoPointShape!) on FIELD_DEFINITION

enum GeoPointShape {
    POINT
    MULTIPOINT
    LINESTRING
    MULTILINESTRING
    POLYGON
    MULTIPOLYGON
}

directive @reference(uri: String!) on FIELD_DEFINITION | OBJECT | INTERFACE | UNION | ENUM | INPUT_OBJECT | SCALAR | ENUM_VALUE

directive @range(min: Float, max: Float) on FIELD_DEFINITION